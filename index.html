<title>CAN I COURT YOU?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap">
<style>
  /* Layout: one centered card-less stage, big question, two buttons; the No button escapes across the whole viewport. */
  :root {
    --bg: #fff0f4;
    --bg-glow: #ffd3e1;
    --fg: #3d1630;
    --muted: #8a5a74;
    --accent: #f0457a;
    --accent-fg: #ffffff;
    --soft: #ffffff;
    --soft-line: #f3b8cc;
    --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, sans-serif;
    --pop: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c0d19; --bg-glow: #3a1430; --fg: #ffe6ee; --muted: #d6a3bb;
      --accent: #ff6a98; --accent-fg: #2a0b1c; --soft: #2c1226; --soft-line: #5b2a49;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c0d19; --bg-glow: #3a1430; --fg: #ffe6ee; --muted: #d6a3bb;
    --accent: #ff6a98; --accent-fg: #2a0b1c; --soft: #2c1226; --soft-line: #5b2a49;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg-glow), var(--bg) 60%) var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    overflow: hidden;
  }
  .stage {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; text-align: center;
  }
  .view[hidden] { display: none; }
  .view { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 30rem; }

  .heart-big { width: 96px; height: 96px; animation: beat 1.4s ease-in-out infinite; }
  .heart-big path, .float path { fill: var(--accent); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }

  h1 {
    font-family: var(--font-display); font-weight: 600; margin: 0;
    font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.1; text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.5; max-width: 26rem; text-wrap: balance; }

  .actions { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; min-height: 72px; }
  button {
    font-family: var(--font-display); font-weight: 600; cursor: pointer;
    border-radius: 999px; border: 2px solid transparent; padding: 0.8em 1.8em; font-size: 1.15rem;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #yes {
    background: var(--accent); color: var(--accent-fg);
    font-size: calc(1.15rem * var(--pop)); transition: font-size .25s ease, transform .15s ease;
    box-shadow: 0 8px 22px -8px var(--accent);
  }
  #yes:hover { transform: scale(1.04); }
  #no {
    background: var(--soft); color: var(--fg); border-color: var(--soft-line);
    transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1);
    z-index: 5;
  }
  #no.free { position: fixed; }

  .taunt { min-height: 1.6em; margin: 0; color: var(--muted); font-weight: 700; }

  .float { position: fixed; bottom: -60px; pointer-events: none; animation: rise linear forwards; z-index: 1; }
  @keyframes rise { to { transform: translateY(-120vh) rotate(var(--rot, 20deg)); opacity: 0; } }
  .win h1 { font-size: clamp(2.2rem, 9vw, 3.6rem); }
  .tiny { font-size: .85rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .heart-big { animation: none; }
    #no { transition: none; }
    .float { animation-duration: 0.01s !important; }
  }
</style>

<main class="stage">
  <section id="ask" class="view">
    <svg class="heart-big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8.2 3 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.700 0 5.800 3.700 4.300 7.100C19.500 16.400 12 21 12 21z"/></svg>
    <h1 id="question">Will you be my girlfriend?</h1>
    <p class="sub" id="sub">I've liked you for a while now, and I finally got brave enough to ask.</p>
    <div class="actions" id="actions">
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
    <p class="taunt" id="taunt" aria-live="polite"></p>
  </section>

  <section id="win" class="view win" hidden>
    <svg class="heart-big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8.2 3 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.700 0 5.800 3.700 4.300 7.100C19.500 16.400 12 21 12 21z"/></svg>
    <h1 id="winTitle">You said yes!</h1>
    <p class="sub" id="winSub">Best answer ever. Screenshot this and send it to me.</p>
    <p class="tiny" id="tries"></p>
  </section>
</main>

<script>
  // Edit these to personalise. A name can also be added to the link, e.g. ...#Maria
  var CONFIG = {
    herName: "",
    question: "Will you be my girlfriend?",
    sub: "I've liked you for a while now, and I finally got brave enough to ask.",
    winSub: "Best answer ever. Screenshot this and send it to me."
  };

  var taunts = [
    "Wrong button.",
    "Nice try.",
    "Too slow!",
    "Are you sure? Think again.",
    "The other one is right there.",
    "I'll wait. I have all night.",
    "That button is broken. Try Yes.",
    "You can't catch it.",
    "Please? That one is shy.",
    "Last chance. Press Yes."
  ];

  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var taunt = document.getElementById("taunt");
  var dodges = 0;

  (function personalise() {
    var hash = "";
    try { hash = decodeURIComponent(location.hash.replace("#", "")).replace(/[^\p{L}\p{M} '-]/gu, "").slice(0, 30); } catch (e) {}
    var name = hash || CONFIG.herName;
    var q = CONFIG.question;
    if (name) q = name + ", " + q.charAt(0).toLowerCase() + q.slice(1);
    document.getElementById("question").textContent = q;
    document.getElementById("sub").textContent = CONFIG.sub;
    document.getElementById("winSub").textContent = CONFIG.winSub;
    if (name) document.getElementById("winTitle").textContent = "You said yes, " + name + "!";
  })();

  function rand(min, max) { return min + Math.random() * Math.max(0, max - min); }

  function dodge(e) {
    if (e && e.cancelable) e.preventDefault();
    dodges++;
    var pad = 12;
    var w = no.offsetWidth, h = no.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var yr = yes.getBoundingClientRect();
    var cur = no.getBoundingClientRect();
    var x, y, tries = 0;
    do {
      x = rand(pad, vw - w - pad);
      y = rand(pad, vh - h - pad);
      tries++;
      var overlapsYes = x < yr.right + 16 && x + w > yr.left - 16 && y < yr.bottom + 16 && y + h > yr.top - 16;
      var tooClose = Math.hypot(x - cur.left, y - cur.top) < 140;
    } while ((overlapsYes || tooClose) && tries < 40);

    no.classList.add("free");
    no.style.left = x + "px";
    no.style.top = y + "px";

    var scale = Math.min(1 + dodges * 0.12, 2);
    document.documentElement.style.setProperty("--pop", scale);
    taunt.textContent = taunts[Math.min(dodges - 1, taunts.length - 1)];
  }

  // Keep a placeholder so the Yes button does not jump when No leaves the row.
  var placeholder = document.createElement("span");
  function lift() {
    if (no.classList.contains("free")) return;
    var r = no.getBoundingClientRect();
    placeholder.style.cssText = "display:inline-block;width:" + r.width + "px;height:" + r.height + "px";
    no.parentNode.insertBefore(placeholder, no);
    no.style.left = r.left + "px";
    no.style.top = r.top + "px";
    no.classList.add("free");
    void no.offsetWidth;
  }
  function onEscape(e) { lift(); dodge(e); }

  no.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") onEscape(e); });
  no.addEventListener("pointerdown", onEscape);
  no.addEventListener("touchstart", onEscape, { passive: false });
  no.addEventListener("click", onEscape);
  no.addEventListener("focus", function (e) { if (dodges > 0) onEscape(e); });

  window.addEventListener("resize", function () {
    if (!no.classList.contains("free")) return;
    var r = no.getBoundingClientRect();
    no.style.left = Math.min(r.left, window.innerWidth - r.width - 12) + "px";
    no.style.top = Math.min(r.top, window.innerHeight - r.height - 12) + "px";
  });

  function burst() {
    var svg = '<svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8.2 3 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.700 0 5.800 3.700 4.300 7.100C19.500 16.400 12 21 12 21z"/></svg>';
    for (var i = 0; i < 40; i++) {
      var el = document.createElement("div");
      var size = rand(18, 54);
      el.className = "float";
      el.innerHTML = svg;
      el.style.width = el.style.height = size + "px";
      el.style.left = rand(0, 100) + "vw";
      el.style.opacity = String(rand(0.5, 1));
      el.style.setProperty("--rot", rand(-40, 40) + "deg");
      el.style.animationDuration = rand(2.5, 5.5) + "s";
      el.style.animationDelay = rand(0, 1.2) + "s";
      document.body.appendChild(el);
      (function (n) { setTimeout(function () { n.remove(); }, 8000); })(el);
    }
  }

  yes.addEventListener("click", function () {
    no.hidden = true;
    placeholder.remove();
    document.getElementById("ask").hidden = true;
    document.getElementById("win").hidden = false;
    document.getElementById("tries").textContent = dodges > 0
      ? "The No button got away " + dodges + (dodges === 1 ? " time." : " times.")
      : "You didn't even try No. I love that.";
    burst();
    setTimeout(burst, 1800);
  });
</script>
